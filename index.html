<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1C1C1E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <title>헬스 인증 트래커</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      /* Apple Dark Mode 기반 배경 */
      --bg: #1C1C1E;
      --card: #2C2C2E;
      --card2: #3A3A3C;
      /* Tailwind 기반 강조색 */
      --accent: #6366F1;
      --green: #10B981;
      --red: #F43F5E;
      --yellow: #FBBF24;
      /* Apple 기반 텍스트 */
      --text: #F5F5F7;
      --text2: #98989D;
      --radius: 20px;
      --gap: 20px;
    }

    body {
      font-family: -apple-system, 'Pretendard', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      padding: 0 0 40px;
    }

    /* 헤더 */
    .header {
      padding: 20px;
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    /* 오늘 인증 섹션 */
    .checkin-section {
      margin: 0 var(--gap);
      display: flex;
      gap: 12px;
    }

    .checkin-label {
      margin: 14px var(--gap) 8px;
      color: var(--text2);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .checkin-card {
      flex: 1;
      padding: 18px 14px;
      border-radius: var(--radius);
      text-align: center;
      cursor: pointer;
      border: none;
      color: white;
      font-family: inherit;
      transition: transform 0.15s, opacity 0.2s;
    }

    .checkin-card:active { transform: scale(0.95); }

    .checkin-card.bogyu { background: linear-gradient(135deg, #6366F1, #4F46E5); }
    .checkin-card.hyerim { background: linear-gradient(135deg, #FB7185, #F43F5E); }
    .checkin-card .card-name {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .checkin-card .card-status {
      font-size: 13px;
      opacity: 0.9;
    }

    .checkin-card.done {
      opacity: 0.4;
      cursor: default;
    }

    .checkin-card.disabled {
      opacity: 0.35;
      cursor: default;
    }

    /* 주간 진행률 */
    .week-progress {
      margin: 0 var(--gap);
      padding: 20px;
      background: var(--card);
      border-radius: var(--radius);
    }

    .week-progress h3 {
      font-size: 13px;
      color: var(--text2);
      margin-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .progress-person { margin-bottom: 14px; }
    .progress-person:last-child { margin-bottom: 0; }

    .progress-person .label {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      margin-bottom: 6px;
    }

    .progress-bar {
      height: 6px;
      background: var(--card2);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar .fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.3s;
    }

    .fill.bogyu { background: linear-gradient(90deg, #818CF8, #6366F1); }
    .fill.hyerim { background: linear-gradient(90deg, #FDA4AF, #FB7185); }

    /* 벌금 카드 */
    .penalty-card {
      margin: 0 var(--gap);
      padding: 20px;
      background: var(--card);
      border-radius: var(--radius);
    }

    .penalty-card h3 {
      font-size: 13px;
      color: var(--text2);
      margin-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .penalty-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
    }

    .penalty-row .name { font-size: 15px; }
    .penalty-row .count { font-size: 13px; color: var(--text2); }

    .penalty-row .amount { font-size: 17px; font-weight: 700; }
    .penalty-row .amount.red { color: var(--red); }
    .penalty-row .amount.green { color: var(--green); }

    .penalty-total {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--card2);
      text-align: center;
      font-size: 15px;
    }

    .penalty-total strong {
      font-size: 18px;
      color: var(--yellow);
    }

    /* 섹션 간격 */
    .section-gap { height: 12px; }

    /* 달력 */
    .calendar-section {
      margin: 0 var(--gap);
      padding: 20px;
      background: var(--card);
      border-radius: var(--radius);
    }

    .cal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .cal-header h3 { font-size: 18px; font-weight: 700; }

    .cal-nav {
      background: var(--card2);
      border: none;
      color: var(--text);
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
    }

    .cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      margin-bottom: 10px;
    }

    .cal-weekdays span {
      font-size: 12px;
      color: var(--text2);
      padding: 6px 4px;
      font-weight: 600;
    }

    .cal-weekdays span:last-child { color: var(--red); }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .cal-day {
      aspect-ratio: 1 / 1;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      border-radius: 14px;
      font-size: 14px;
      cursor: pointer;
      background: var(--card2);
      transition: transform 0.1s;
      padding: 4px 1px 2px;
    }

    .cal-day:active { transform: scale(0.9); }
    .cal-day.empty { background: transparent; cursor: default; }
    .cal-day.other-month { opacity: 0.3; }
    .cal-day.today { border: 2px solid var(--accent); }
    .cal-day.future { opacity: 0.25; cursor: default; }

    .cal-day .day-num {
      font-size: 12px;
      line-height: 1;
      margin-bottom: 2px;
      flex: 0 0 auto;
    }

    .cal-day .marks {
      display: flex;
      flex-direction: column;
      gap: 1px;
      width: 100%;
      font-size: 8px;
      line-height: 1;
      overflow: hidden;
    }

    .mark-row {
      display: flex;
      justify-content: center;
      gap: 1px;
      white-space: nowrap;
    }

    .mark-type { opacity: 0.85; }
    .mark-name { opacity: 0.25; font-weight: 700; }
    .mark-name.on { opacity: 1; }
    .mark-name.bogyu.on { color: #A5B4FC; }
    .mark-name.hyerim.on { color: #FDA4AF; }

    /* 모달 */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 300;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-overlay.active { display: flex; }

    .modal {
      background: var(--card);
      border-radius: var(--radius);
      padding: 24px;
      width: 100%;
      max-width: 400px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal h3 { font-size: 20px; margin-bottom: 16px; }

    .photo-upload-area {
      border: 2px dashed #444;
      border-radius: var(--radius);
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      margin-bottom: 16px;
      transition: border-color 0.2s;
    }

    .photo-upload-area:hover { border-color: var(--accent); }

    .photo-upload-area img {
      max-width: 100%;
      max-height: 300px;
      border-radius: 12px;
    }

    .photo-upload-area p { color: var(--text2); font-size: 14px; }

    .modal-btns { display: flex; gap: 10px; }

    .modal-btns button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-cancel { background: #333; color: var(--text); }
    .btn-submit { background: var(--accent); color: white; }
    .btn-submit:disabled { background: #555; color: #888; }

    /* 사진 보기 모달 */
    .photo-view-modal .photos-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .photo-card {
      background: #111;
      border-radius: 12px;
      overflow: hidden;
    }

    .photo-card img {
      width: 100%;
      max-height: 400px;
      object-fit: contain;
    }

    .photo-card .info {
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .photo-card .info .badge {
      padding: 4px 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
    }

    .badge.bogyu { background: linear-gradient(135deg, #6366F1, #4F46E5); color: white; }
    .badge.hyerim { background: linear-gradient(135deg, #FB7185, #F43F5E); color: white; }

    /* 에러 메시지 */
    #debugMsg {
      color: #ff4444;
      font-size: 13px;
      text-align: center;
      padding: 0 16px;
      min-height: 20px;
    }

    /* 외부 브라우저 안내 배너 */
    .browser-banner {
      display: none;
      padding: 12px 20px;
      background: var(--accent);
      color: white;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .browser-banner span {
      font-size: 12px;
      opacity: 0.85;
      display: block;
      margin-top: 4px;
      font-weight: 400;
    }
  </style>
</head>
<body>

<!-- 외부 브라우저 안내 -->
<div class="browser-banner" id="browserBanner">
  Chrome으로 열기
  <span>홈화면에 추가하면 앱처럼 사용할 수 있어요</span>
</div>

<!-- 헤더 -->
<div class="header">💪 헬스 트래커</div>

<!-- 오늘 인증 -->
<div class="checkin-label">💪 운동 인증</div>
<div class="checkin-section">
  <button class="checkin-card bogyu" id="checkinBogyu">
    <div class="card-name">보규</div>
    <div class="card-status" id="statusBogyu">📸 인증하기</div>
  </button>
  <button class="checkin-card hyerim" id="checkinHyerim">
    <div class="card-name">혜림</div>
    <div class="card-status" id="statusHyerim">📸 인증하기</div>
  </button>
</div>

<div class="checkin-label">🌞 아침 인증</div>
<div class="checkin-section">
  <button class="checkin-card morning bogyu" id="morningBogyu">
    <div class="card-name">보규</div>
    <div class="card-status" id="statusMorningBogyu">11시 전 · 야외 · 평일 4회</div>
  </button>
  <button class="checkin-card morning hyerim" id="morningHyerim">
    <div class="card-name">혜림</div>
    <div class="card-status" id="statusMorningHyerim">9시 전 · 사무실 · 평2+주2</div>
  </button>
</div>

<div id="debugMsg"></div>

<div class="section-gap"></div>

<!-- 달력 -->
<div class="calendar-section">
  <div class="cal-header">
    <button class="cal-nav" id="prevMonth">◀</button>
    <h3 id="calTitle"></h3>
    <button class="cal-nav" id="nextMonth">▶</button>
  </div>
  <div class="cal-weekdays">
    <span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span><span>일</span>
  </div>
  <div class="cal-grid" id="calGrid"></div>
</div>

<div class="section-gap"></div>

<!-- 이번주 진행률 -->
<div class="week-progress">
  <h3>📊 이번 주 진행률</h3>
  <div class="progress-person">
    <div class="label">
      <span>보규 (유산소 30분)</span>
      <span id="bogyuWeekCount">0/4</span>
    </div>
    <div class="progress-bar"><div class="fill bogyu" id="bogyuBar" style="width:0%"></div></div>
  </div>
  <div class="progress-person">
    <div class="label">
      <span>혜림 (유산소 20분)</span>
      <span id="hyerimWeekCount">0/4</span>
    </div>
    <div class="progress-bar"><div class="fill hyerim" id="hyerimBar" style="width:0%"></div></div>
  </div>
</div>

<div class="section-gap"></div>

<div class="week-progress">
  <h3>🌞 이번 주 아침 진행률</h3>
  <div class="progress-person">
    <div class="label">
      <span>보규 (11시 전 야외 · 평일 4회)</span>
      <span id="bogyuMorningWeekCount">0/4</span>
    </div>
    <div class="progress-bar"><div class="fill bogyu" id="bogyuMorningBar" style="width:0%"></div></div>
  </div>
  <div class="progress-person">
    <div class="label">
      <span>혜림 (9시 전 사무실 · 평2+주2)</span>
      <span id="hyerimMorningWeekCount">평0/2 주0/2</span>
    </div>
    <div class="progress-bar"><div class="fill hyerim" id="hyerimMorningBar" style="width:0%"></div></div>
  </div>
</div>

<div class="section-gap"></div>

<div class="penalty-card">
  <h3>💰 이번 달 벌금 현황</h3>
  <div class="penalty-row">
    <div>
      <span class="name">보규</span>
      <span class="count" id="bogyuMiss"></span>
    </div>
    <span class="amount" id="bogyuPenalty"></span>
  </div>
  <div class="penalty-row">
    <div>
      <span class="name">혜림</span>
      <span class="count" id="hyerimMiss"></span>
    </div>
    <span class="amount" id="hyerimPenalty"></span>
  </div>
  <div class="penalty-total" id="penaltyTotal"></div>
</div>

<!-- 인증 모달 -->
<div class="modal-overlay" id="checkinModal">
  <div class="modal">
    <h3 id="checkinTitle">📸 운동 인증</h3>
    <div class="photo-upload-area" id="uploadArea">
      <p>📷 사진을 촬영하거나 선택하세요</p>
    </div>
    <input type="file" id="photoInput" accept="image/*" style="display:none">
    <div class="modal-btns">
      <button class="btn-cancel" id="cancelBtn">취소</button>
      <button class="btn-submit" id="submitBtn" disabled>인증하기</button>
    </div>
  </div>
</div>

<!-- 사진 보기 모달 -->
<div class="modal-overlay photo-view-modal" id="photoViewModal">
  <div class="modal">
    <h3 id="photoViewTitle"></h3>
    <div class="photos-grid" id="photosGrid"></div>
    <div style="margin-top:16px">
      <button class="btn-cancel" style="width:100%;padding:14px;border-radius:12px" id="closePhotoBtn">닫기</button>
    </div>
  </div>
</div>

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
// ============================================
// 설정
// ============================================
var SUPABASE_URL = 'https://hdxrxfygqfakgcefkrdc.supabase.co';
var SUPABASE_KEY = 'sb_publishable_HSZEGMrG-N4I6sdkSRQFSw_W4r3f3R0';
var WEEKLY_TARGET_BOGYU = 4;
var WEEKLY_TARGET_HYERIM = 4;
var PENALTY_PER_MISS = 100000;
var APP_START_DATE = '2026-02-24';
var MORNING_START_DATE = '2026-04-13';
var TYPE_WORKOUT = 'workout';
var TYPE_MORNING = 'morning';

// ============================================
// 인앱 브라우저 감지
// ============================================
(function() {
  var ua = navigator.userAgent || '';
  var isInApp = /KAKAOTALK|NAVER|Line|Instagram|FB|FBAN|FBAV/i.test(ua);
  if (isInApp) {
    var banner = document.getElementById('browserBanner');
    banner.style.display = 'block';
    banner.addEventListener('click', function() {
      // Android intent로 Chrome 열기
      var url = location.href;
      if (/android/i.test(ua)) {
        location.href = 'intent://' + url.replace(/https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end';
      } else {
        // iOS는 Safari로 복사 안내
        window.open(url, '_blank');
      }
    });
  }
})();

// ============================================
// 초기화
// ============================================
var supabaseClient = null;
var currentUser = null;
var currentCheckinType = TYPE_WORKOUT;
var currentMonth = new Date();
var checkinData = {};
var selectedFile = null;

function showDebug(msg) {
  var el = document.getElementById('debugMsg');
  if (el) el.textContent = msg;
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}

function initSupabase() {
  if (supabaseClient) return true;
  try {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    return true;
  } catch(e) {
    showDebug('연결 오류: ' + e.message);
    return false;
  }
}

// ============================================
// 데이터 로드
// ============================================
async function loadData() {
  var year = currentMonth.getFullYear();
  var month = currentMonth.getMonth();
  // 월 경계 주간 데이터 포함을 위해 ±7일 버퍼
  var bufferStart = new Date(year, month, 1 - 7);
  var bufferEnd = new Date(year, month + 1, 7);
  var startDate = formatDate(bufferStart);
  var endDate = formatDate(bufferEnd);

  var result = await supabaseClient
    .from('checkins')
    .select('*')
    .gte('checked_date', startDate)
    .lte('checked_date', endDate)
    .order('checked_date');

  if (result.error) {
    console.error('Load error:', result.error);
    return;
  }

  checkinData = {};
  (result.data || []).forEach(function(row) {
    if (!checkinData[row.checked_date]) {
      checkinData[row.checked_date] = {};
    }
    var type = row.checkin_type || TYPE_WORKOUT;
    if (!checkinData[row.checked_date][type]) {
      checkinData[row.checked_date][type] = {};
    }
    checkinData[row.checked_date][type][row.user_name] = row;
  });

  renderCalendar();
  renderPenalty();
  renderWeekProgress();
  updateCheckinBtns();
}

// ============================================
// 인증 버튼 상태 업데이트
// ============================================
function updateCheckinBtns() {
  var todayStr = formatDate(new Date());
  var workoutData = getTypeData(todayStr, TYPE_WORKOUT);
  var morningData = getTypeData(todayStr, TYPE_MORNING);

  var btnB = document.getElementById('checkinBogyu');
  var statusB = document.getElementById('statusBogyu');
  if (workoutData['\uBCF4\uADDC']) {
    statusB.textContent = '\u2705 완료';
    btnB.classList.add('done');
  } else {
    statusB.textContent = '\uD83D\uDCF8 인증하기';
    btnB.classList.remove('done');
  }

  var btnH = document.getElementById('checkinHyerim');
  var statusH = document.getElementById('statusHyerim');
  if (workoutData['\uD61C\uB9BC']) {
    statusH.textContent = '\u2705 완료';
    btnH.classList.add('done');
  } else {
    statusH.textContent = '\uD83D\uDCF8 인증하기';
    btnH.classList.remove('done');
  }

  updateMorningBtn('\uBCF4\uADDC', 'morningBogyu', 'statusMorningBogyu', morningData);
  updateMorningBtn('\uD61C\uB9BC', 'morningHyerim', 'statusMorningHyerim', morningData);
}

function updateMorningBtn(userName, btnId, statusId, morningData) {
  var btn = document.getElementById(btnId);
  var status = document.getElementById(statusId);
  btn.classList.remove('done');

  if (morningData[userName]) {
    status.textContent = '\u2705 완료';
    btn.classList.add('done');
    return;
  }

  status.textContent = userName === '\uBCF4\uADDC'
    ? '11시 전 · 야외 · 평일 4회'
    : '9시 전 · 사무실 · 평2+주2';
}

function getTypeData(dateStr, type) {
  var dayData = checkinData[dateStr] || {};
  return dayData[type] || {};
}

function renderCalendarMarks(dayData) {
  var workout = dayData[TYPE_WORKOUT] || {};
  var morning = dayData[TYPE_MORNING] || {};
  return '<div class="marks">'
    + renderMarkRow('\uD83D\uDCAA', workout)
    + renderMarkRow('\uD83C\uDF1E', morning)
    + '</div>';
}

function renderMarkRow(label, data) {
  var bOn = data['\uBCF4\uADDC'] ? ' on' : '';
  var hOn = data['\uD61C\uB9BC'] ? ' on' : '';
  return '<div class="mark-row"><span class="mark-type">' + label + '</span>'
    + '<span class="mark-name bogyu' + bOn + '">\uBCF4</span>'
    + '<span class="mark-name hyerim' + hOn + '">\uD61C</span></div>';
}

// ============================================
// 달력 렌더링
// ============================================
function renderCalendar() {
  var year = currentMonth.getFullYear();
  var month = currentMonth.getMonth();
  var today = new Date();
  var todayStr = formatDate(today);

  document.getElementById('calTitle').textContent = year + '\uB144 ' + (month + 1) + '\uC6D4';

  var firstDow = new Date(year, month, 1).getDay();
  var firstDay = firstDow === 0 ? 6 : firstDow - 1; // 월=0, 화=1, ..., 일=6
  var daysInMonth = new Date(year, month + 1, 0).getDate();

  var prevMonthDays = new Date(year, month, 0).getDate();
  var html = '';

  // 이전 달 날짜 (빈 칸 대신 실제 날짜 표시)
  for (var i = firstDay - 1; i >= 0; i--) {
    var prevD = prevMonthDays - i;
    var prevDateObj = new Date(year, month - 1, prevD);
    var prevDateStr = formatDate(prevDateObj);
    var prevDayData = checkinData[prevDateStr] || {};
    html += '<div class="cal-day other-month" data-date="' + prevDateStr + '">';
    html += '<span class="day-num">' + prevD + '</span>' + renderCalendarMarks(prevDayData) + '</div>';
  }

  // 현재 달 날짜
  for (var d = 1; d <= daysInMonth; d++) {
    var dateStr = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    var dateObj = new Date(year, month, d);
    var isToday = dateStr === todayStr;
    var isFuture = dateObj > today;

    var dayData = checkinData[dateStr] || {};
    var marks = !isFuture ? renderCalendarMarks(dayData) : '';

    var cls = 'cal-day';
    if (isToday) cls += ' today';
    if (isFuture) cls += ' future';

    if (!isFuture) {
      html += '<div class="' + cls + '" data-date="' + dateStr + '">';
    } else {
      html += '<div class="' + cls + '">';
    }
    html += '<span class="day-num">' + d + '</span>' + marks + '</div>';
  }

  // 다음 달 날짜 (주 완성)
  var totalCells = firstDay + daysInMonth;
  var trailingDays = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
  for (var t = 1; t <= trailingDays; t++) {
    var nextDateObj = new Date(year, month + 1, t);
    var nextDateStr = formatDate(nextDateObj);
    var nextDayData = checkinData[nextDateStr] || {};
    var nextIsFuture = nextDateObj > today;
    var nextMarks = !nextIsFuture ? renderCalendarMarks(nextDayData) : '';
    var nextCls = 'cal-day other-month';
    if (nextDateStr === todayStr) nextCls += ' today';
    if (nextIsFuture) nextCls += ' future';
    if (!nextIsFuture) {
      html += '<div class="' + nextCls + '" data-date="' + nextDateStr + '">';
    } else {
      html += '<div class="' + nextCls + '">';
    }
    html += '<span class="day-num">' + t + '</span>' + nextMarks + '</div>';
  }

  document.getElementById('calGrid').innerHTML = html;
}

// ============================================
// 벌금 계산
// ============================================
function renderPenalty() {
  var year = currentMonth.getFullYear();
  var month = currentMonth.getMonth();
  var today = new Date();
  var bogyuWorkoutMisses = 0;
  var hyerimWorkoutMisses = 0;
  var bogyuMorningMisses = 0;
  var hyerimMorningMisses = 0;
  var weeks = getCompletedWeeks(year, month, today);

  weeks.forEach(function(week) {
    var bc = 0, hc = 0;
    var bm = 0, hmWeekday = 0, hmWeekend = 0;
    var includeMorningPenalty = week[0] >= MORNING_START_DATE;
    week.forEach(function(dateStr) {
      var workout = getTypeData(dateStr, TYPE_WORKOUT);
      var morning = getTypeData(dateStr, TYPE_MORNING);
      if (workout['\uBCF4\uADDC']) bc++;
      if (workout['\uD61C\uB9BC']) hc++;

      var d = new Date(dateStr + 'T00:00:00');
      var dow = d.getDay();
      var isWeekend = dow === 0 || dow === 6;
      if (!isWeekend && morning['\uBCF4\uADDC']) bm++;
      if (morning['\uD61C\uB9BC']) {
        if (isWeekend) hmWeekend++;
        else hmWeekday++;
      }
    });
    bogyuWorkoutMisses += Math.max(0, WEEKLY_TARGET_BOGYU - bc);
    hyerimWorkoutMisses += Math.max(0, WEEKLY_TARGET_HYERIM - hc);
    if (includeMorningPenalty) {
      bogyuMorningMisses += Math.max(0, 4 - bm);
      hyerimMorningMisses += getHyerimMorningMisses(hmWeekday, hmWeekend);
    }
  });

  var bogyuMisses = bogyuWorkoutMisses + bogyuMorningMisses;
  var hyerimMisses = hyerimWorkoutMisses + hyerimMorningMisses;
  var bp = bogyuMisses * PENALTY_PER_MISS;
  var hp = hyerimMisses * PENALTY_PER_MISS;

  document.getElementById('bogyuMiss').textContent = bogyuMisses > 0
    ? '(운동 ' + bogyuWorkoutMisses + '회 · 아침 ' + bogyuMorningMisses + '회 미달)'
    : '(\uC644\uBCBD!)';
  document.getElementById('hyerimMiss').textContent = hyerimMisses > 0
    ? '(운동 ' + hyerimWorkoutMisses + '회 · 아침 ' + hyerimMorningMisses + '회 미달)'
    : '(\uC644\uBCBD!)';

  var bEl = document.getElementById('bogyuPenalty');
  bEl.textContent = formatMoney(bp);
  bEl.className = 'amount ' + (bp > 0 ? 'red' : 'green');

  var hEl = document.getElementById('hyerimPenalty');
  hEl.textContent = formatMoney(hp);
  hEl.className = 'amount ' + (hp > 0 ? 'red' : 'green');

  var totalEl = document.getElementById('penaltyTotal');
  var diff = bp - hp;
  if (diff > 0) {
    totalEl.innerHTML = '\uC815\uC0B0: <strong>\uBCF4\uADDC \u2192 \uD61C\uB9BC ' + formatMoney(diff) + '</strong>';
  } else if (diff < 0) {
    totalEl.innerHTML = '\uC815\uC0B0: <strong>\uD61C\uB9BC \u2192 \uBCF4\uADDC ' + formatMoney(-diff) + '</strong>';
  } else {
    totalEl.innerHTML = '<strong>\uB3D9\uC810! \uC815\uC0B0 \uC5C6\uC74C \uD83D\uDC4F</strong>';
  }
}

function getHyerimMorningMisses(weekdayCount, weekendCount) {
  var normalMisses = Math.max(0, 2 - weekdayCount) + Math.max(0, 2 - weekendCount);
  var fallbackMisses = Math.max(0, 4 - weekdayCount);
  return Math.min(normalMisses, fallbackMisses);
}

function getCompletedWeeks(year, month, today) {
  var weeks = [];
  var appStart = new Date(APP_START_DATE + 'T00:00:00');

  // 해당 월 1일의 직전 월요일 찾기
  var firstOfMonth = new Date(year, month, 1);
  var firstDow = firstOfMonth.getDay();
  var mondayOffset = firstDow === 0 ? -6 : 1 - firstDow;
  var iterStart = new Date(year, month, 1 + mondayOffset);

  // 해당 월 말일의 직후 일요일 찾기
  var lastOfMonth = new Date(year, month + 1, 0);
  var lastDow = lastOfMonth.getDay();
  var sundayOffset = lastDow === 0 ? 0 : 7 - lastDow;
  var iterEnd = new Date(year, month + 1, sundayOffset);

  var currentWeek = [];
  var d = new Date(iterStart);
  while (d <= iterEnd) {
    currentWeek.push(formatDate(d));

    if (d.getDay() === 0) {
      // 주의 월요일이 해당 월에 속하면 이 달의 벌금으로 카운트
      var weekMonday = new Date(d);
      weekMonday.setDate(d.getDate() - 6);
      if (weekMonday.getMonth() === month && currentWeek.length >= 7 && d <= today && d >= appStart) {
        weeks.push(currentWeek.slice());
      }
      currentWeek = [];
    }
    d.setDate(d.getDate() + 1);
  }
  return weeks;
}

// ============================================
// 이번 주 진행률
// ============================================
function renderWeekProgress() {
  var today = new Date();
  var dow = today.getDay();
  // 월~일 기준: 월요일=0일전~6일전
  var daysSinceMonday = dow === 0 ? 6 : dow - 1;
  var startOfWeek = new Date(today);
  startOfWeek.setDate(today.getDate() - daysSinceMonday);

  var bc = 0, hc = 0;
  var bm = 0, hmWeekday = 0, hmWeekend = 0;
  for (var i = 0; i <= daysSinceMonday; i++) {
    var d = new Date(startOfWeek);
    d.setDate(startOfWeek.getDate() + i);
    var dateStr = formatDate(d);
    var workout = getTypeData(dateStr, TYPE_WORKOUT);
    var morning = getTypeData(dateStr, TYPE_MORNING);
    if (workout['\uBCF4\uADDC']) bc++;
    if (workout['\uD61C\uB9BC']) hc++;

    var dow = d.getDay();
    var isWeekend = dow === 0 || dow === 6;
    if (!isWeekend && morning['\uBCF4\uADDC']) bm++;
    if (morning['\uD61C\uB9BC']) {
      if (isWeekend) hmWeekend++;
      else hmWeekday++;
    }
  }

  document.getElementById('bogyuWeekCount').textContent = bc + '/' + WEEKLY_TARGET_BOGYU;
  document.getElementById('hyerimWeekCount').textContent = hc + '/' + WEEKLY_TARGET_HYERIM;
  document.getElementById('bogyuBar').style.width = Math.min(100, (bc / WEEKLY_TARGET_BOGYU) * 100) + '%';
  document.getElementById('hyerimBar').style.width = Math.min(100, (hc / WEEKLY_TARGET_HYERIM) * 100) + '%';

  document.getElementById('bogyuMorningWeekCount').textContent = bm + '/4';
  document.getElementById('hyerimMorningWeekCount').textContent = '평' + hmWeekday + '/2 주' + hmWeekend + '/2';
  document.getElementById('bogyuMorningBar').style.width = Math.min(100, (bm / 4) * 100) + '%';
  document.getElementById('hyerimMorningBar').style.width = Math.min(100, ((4 - getHyerimMorningMisses(hmWeekday, hmWeekend)) / 4) * 100) + '%';

  if (formatDate(today) < MORNING_START_DATE) {
    document.getElementById('bogyuMorningWeekCount').textContent = '4/13 시작';
    document.getElementById('hyerimMorningWeekCount').textContent = '4/13 시작';
    document.getElementById('bogyuMorningBar').style.width = '0%';
    document.getElementById('hyerimMorningBar').style.width = '0%';
  }
}

// ============================================
// 인증 모달
// ============================================
function openCheckinModal(userName, checkinType) {
  var todayStr = formatDate(new Date());
  var todayData = getTypeData(todayStr, checkinType);
  if (todayData[userName]) return;

  currentUser = userName;
  currentCheckinType = checkinType || TYPE_WORKOUT;
  selectedFile = null;
  document.getElementById('photoInput').value = '';
  document.getElementById('uploadArea').innerHTML = '<p>\uD83D\uDCF7 \uC0AC\uC9C4\uC744 \uCCA8\uBD80\uD558\uAC70\uB098 \uC120\uD0DD\uD558\uC138\uC694</p>';
  document.getElementById('submitBtn').disabled = true;
  var typeLabel = currentCheckinType === TYPE_MORNING ? '아침 인증' : '운동 인증';
  document.getElementById('checkinTitle').textContent = '\uD83D\uDCF8 ' + userName + ' ' + typeLabel;
  document.getElementById('checkinModal').classList.add('active');
}

function closeCheckinModal() {
  document.getElementById('checkinModal').classList.remove('active');
}

function previewPhoto(input) {
  if (input.files && input.files[0]) {
    selectedFile = input.files[0];
    var reader = new FileReader();
    reader.onload = function(e) {
      document.getElementById('uploadArea').innerHTML = '<img src="' + e.target.result + '" alt="preview">';
      document.getElementById('submitBtn').disabled = false;
    };
    reader.readAsDataURL(selectedFile);
  }
}

async function submitCheckin() {
  if (!selectedFile || !currentUser) return;

  var btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '\uC5C5\uB85C\uB4DC \uC911...';

  try {
    var todayStr = formatDate(new Date());
    var safeUser = currentUser === '\uBCF4\uADDC' ? 'bogyu' : 'hyerim';
    var safeType = currentCheckinType === TYPE_MORNING ? 'morning' : 'workout';
    var fileName = safeType + '/' + safeUser + '/' + todayStr + '_' + Date.now() + '.jpg';

    var uploadResult = await supabaseClient.storage
      .from('photos')
      .upload(fileName, selectedFile, { contentType: selectedFile.type });

    if (uploadResult.error) throw uploadResult.error;

    var urlData = supabaseClient.storage
      .from('photos')
      .getPublicUrl(fileName);

    var payload = {
      user_name: currentUser,
      checkin_type: currentCheckinType,
      photo_url: urlData.data.publicUrl,
      checked_date: todayStr
    };

    var insertResult = await supabaseClient
      .from('checkins')
      .insert(payload);

    if (insertResult.error && isMissingCheckinTypeError(insertResult.error)) {
      if (currentCheckinType === TYPE_MORNING) {
        throw new Error('아침 인증용 DB 업데이트가 아직 필요합니다. supabase-migration-add-morning.sql을 먼저 실행해주세요.');
      }
      delete payload.checkin_type;
      insertResult = await supabaseClient
        .from('checkins')
        .insert(payload);
    }

    if (insertResult.error) throw insertResult.error;

    closeCheckinModal();
    await loadData();

  } catch (err) {
    console.error('Submit error:', err);
    showDebug('\uC5C5\uB85C\uB4DC \uC624\uB958: ' + (err.message || JSON.stringify(err)));
    btn.disabled = false;
    btn.textContent = '\uC778\uC99D\uD558\uAE30';
  }
}

// ============================================
// 날짜 클릭 → 사진 보기
// ============================================
function viewDay(dateStr) {
  var dayData = checkinData[dateStr] || {};
  var parts = dateStr.split('-');

  document.getElementById('photoViewTitle').textContent = parseInt(parts[1]) + '\uC6D4 ' + parseInt(parts[2]) + '\uC77C \uC778\uC99D';

  var html = '';
  [
    { type: TYPE_WORKOUT, label: '\uD83D\uDCAA 운동' },
    { type: TYPE_MORNING, label: '\uD83C\uDF1E 아침' }
  ].forEach(function(group) {
    var typeData = dayData[group.type] || {};
    var groupHtml = '';
    ['\uBCF4\uADDC', '\uD61C\uB9BC'].forEach(function(name) {
      if (typeData[name]) {
        var photoUrl = typeData[name].photo_url;
        var cls = name === '\uBCF4\uADDC' ? 'bogyu' : 'hyerim';
        groupHtml += '<div class="photo-card">';
        if (photoUrl && photoUrl !== 'none' && photoUrl !== '') {
          groupHtml += '<img src="' + photoUrl + '" alt="' + name + '" loading="lazy">';
        }
        groupHtml += '<div class="info">';
        groupHtml += '<span class="badge ' + cls + '">' + name + '</span>';
        groupHtml += '<span style="color:#999;font-size:12px">' + new Date(typeData[name].created_at).toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit'}) + '</span>';
        groupHtml += '</div></div>';
      }
    });

    if (groupHtml) {
      html += '<h4 style="margin:8px 0 0;color:#ccc;font-size:14px">' + group.label + '</h4>' + groupHtml;
    }
  });

  if (!html) {
    html = '<p style="text-align:center;color:#999;padding:20px">\uC774 \uB0A0\uC740 \uC778\uC99D \uAE30\uB85D\uC774 \uC5C6\uC2B5\uB2C8\uB2E4</p>';
  }

  document.getElementById('photosGrid').innerHTML = html;
  document.getElementById('photoViewModal').classList.add('active');
}

// ============================================
// 유틸
// ============================================
function formatDate(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function formatMoney(amount) {
  if (amount === 0) return '0\uC6D0';
  return (amount / 10000) + '\uB9CC\uC6D0';
}

function isMissingCheckinTypeError(error) {
  var msg = ((error && error.message) || '').toLowerCase();
  var details = ((error && error.details) || '').toLowerCase();
  return (msg + ' ' + details).indexOf('checkin_type') !== -1;
}

// ============================================
// 이벤트 바인딩
// ============================================
window.addEventListener('DOMContentLoaded', function() {
  if (!initSupabase()) return;

  document.getElementById('checkinBogyu').addEventListener('click', function() {
    openCheckinModal('\uBCF4\uADDC', TYPE_WORKOUT);
  });
  document.getElementById('checkinHyerim').addEventListener('click', function() {
    openCheckinModal('\uD61C\uB9BC', TYPE_WORKOUT);
  });
  document.getElementById('morningBogyu').addEventListener('click', function() {
    openCheckinModal('\uBCF4\uADDC', TYPE_MORNING);
  });
  document.getElementById('morningHyerim').addEventListener('click', function() {
    openCheckinModal('\uD61C\uB9BC', TYPE_MORNING);
  });
  document.getElementById('uploadArea').addEventListener('click', function() {
    document.getElementById('photoInput').click();
  });
  document.getElementById('photoInput').addEventListener('change', function() {
    previewPhoto(this);
  });
  document.getElementById('cancelBtn').addEventListener('click', closeCheckinModal);
  document.getElementById('submitBtn').addEventListener('click', submitCheckin);
  document.getElementById('closePhotoBtn').addEventListener('click', function() {
    document.getElementById('photoViewModal').classList.remove('active');
  });
  document.getElementById('prevMonth').addEventListener('click', function() {
    currentMonth.setMonth(currentMonth.getMonth() - 1);
    loadData();
  });
  document.getElementById('nextMonth').addEventListener('click', function() {
    currentMonth.setMonth(currentMonth.getMonth() + 1);
    loadData();
  });
  document.getElementById('calGrid').addEventListener('click', function(e) {
    var day = e.target.closest('.cal-day[data-date]');
    if (day) viewDay(day.dataset.date);
  });

  loadData();
});
</script>
